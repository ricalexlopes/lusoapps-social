# Publishes ONLY the posts placed in approved/ (each one once). Results (post ids, never keys) go to approved/*.result.json.
name: publish-approved
on:
  push:
    branches: [main]
    paths: ["approved/*.json"]
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Publish approved posts
        env:
          FB_TOKEN_SWIMHEAT: ${{ secrets.FB_TOKEN_SWIMHEAT }}
          FB_TOKEN_FLIGHTHOME: ${{ secrets.FB_TOKEN_FLIGHTHOME }}
          FB_TOKEN_STORMHOME: ${{ secrets.FB_TOKEN_STORMHOME }}
        run: python robot/publish.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the results
        if: always()
        run: |
          git config user.name "lusoapps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add approved
          git diff --cached --quiet || (git commit -m "Publish results" && git pull --rebase -q && git push)
