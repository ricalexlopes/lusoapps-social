# Writes example posts (text + image) from each site's public data into examples/ and out/.
# Publishes NOTHING and gets no page keys.
name: examples
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["robot/**", ".github/workflows/examples.yml"]
permissions:
  contents: write
concurrency: { group: repo-write, cancel-in-progress: false }
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet matplotlib
      - name: Save FlightHome tracks, then write the examples (nothing is published)
        run: |
          python robot/social.py collect
          python robot/social.py examples | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the examples
        run: |
          git config user.name "lusoapps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in examples out traces; do if [ -e "$p" ]; then git add "$p"; fi; done
          git diff --cached --quiet || (git commit -m "Example posts (not published)" && git pull --rebase -q && git push)
